body{

    background-size: cover;
    background-attachment: fixed;
    color: white;
    overflow-x: hidden;

/* --- HYPER HEADER ANIMATIONS --- */
header {
    text-align: center;
    padding: 25px 20px;
    background: linear-gradient(90deg, #ff003c, #000, #ff003c);
    background-size: 300% 300%;
    animation: fireGradient 4s ease infinite;
    box-shadow: 0 0 35px #ff003c;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    border-bottom: 3px solid #ff003c;
}

@keyframes fireGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.logo-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #ff003c;
    box-shadow: 0 0 25px #ff003c, 0 0 10px #ffd000;
    object-fit: cover;
    margin-bottom: 12px;
    animation: hyperPulse 1.8s infinite alternate;
}

@keyframes hyperPulse {
    0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 15px #ff003c; }
    100% { transform: scale(1.1) rotate(3deg); box-shadow: 0 0 35px #ff003c, 0 0 20px #ffd000; }
}

header h1 {
    font-size: 30px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c, 0 0 30px #ffd000;
    animation: glitchText 2.5s infinite;
}

@keyframes glitchText {
    0%, 100% { transform: skew(0deg); }
    92% { transform: skew(0deg); }
    94% { transform: skew(-8deg); text-shadow: -3px 0 #00d9ff, 3px 0 #ff003c; }
    96% { transform: skew(8deg); text-shadow: 3px 0 #00d9ff, -3px 0 #ff003c; }
    98% { transform: skew(0deg); }
}

/* --- SEARCH BAR ANIMATIONS --- */
.search-container {
    text-align: center;
    margin: 25px 10px;
}

.search-container input {
    padding: 14px 22px;
    width: 90%;
    max-width: 480px;
    background: #000;
    color: #fff;
    border: 2px solid #ff003c;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
    box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
    text-align: center;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.search-container input:focus {
    box-shadow: 0 0 30px #ff003c, 0 0 15px #00d9ff;
    border-color: #00d9ff;
    transform: scale(1.05);
}

/* --- CARDS GRID & GAMING HOVER --- */
.cards-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
    padding: 15px;
}

.card {
    width: 330px;
    background: rgba(12, 12, 12, 0.95);
    border: 2px solid #ff003c;
    border-radius: 15px;
    padding: 16px;
    box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
    position: relative;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: cardEntrance 0.6s ease forwards;
    backdrop-filter: blur(8px);
}

@keyframes cardEntrance {
    from { opacity: 0; transform: translateY(40px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.card:hover {
    transform: translateY(-12px) scale(1.03);
    border-color: #ffd000;
    box-shadow: 0 0 35px rgba(255, 0, 60, 0.9), 0 0 20px rgba(255, 208, 0, 0.7);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.card-title-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.card-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #ffd000;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(255, 208, 0, 0.6);
    transition: transform 0.5s ease;
}

.card:hover .card-avatar {
    transform: rotate(360deg) scale(1.1);
}

.card-title {
    font-size: 18px;
    font-weight: bold;
    color: #ffd000;
    text-shadow: 0 0 8px rgba(255, 208, 0, 0.6);
}

.login-type-badge {
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    box-shadow: 0 0 10px currentColor;
}

.bg-google { background: #ea4335; color: white; }
.bg-facebook { background: #1877f2; color: white; }

.field-group {
    margin-bottom: 8px;
    background: #111;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #222;
    transition: border-color 0.3s;
}

.card:hover .field-group {
    border-color: #333;
}

.field-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.field-label {
    font-size: 11px;
    color: #aaa;
    display: block;
}

.field-value {
    font-size: 14px;
    word-break: break-all;
    font-weight: bold;
    margin-top: 2px;
}

.backup-codes-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 5px;
    margin-top: 5px;
    max-height: 180px;
    overflow-y: auto;
    padding-right: 4px;
}

.backup-codes-grid::-webkit-scrollbar {
    width: 4px;
}
.backup-codes-grid::-webkit-scrollbar-thumb {
    background: #ff003c;
    border-radius: 4px;
}

.backup-code-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #000;
    padding: 5px 8px;
    border: 1px solid #222;
    border-radius: 4px;
    transition: all 0.3s ease;
}

.backup-code-row:hover {
    border-color: #00d9ff;
    box-shadow: 0 0 10px rgba(0, 217, 255, 0.4);
    transform: translateX(2px);
}

.backup-code-item {
    font-size: 13px;
    font-family: monospace;
    color: #00d9ff;
    letter-spacing: 1px;
}

/* --- FIRE & COOL ANIMATION BUTTONS --- */
.copy-btn {
    background: linear-gradient(45deg, #ff003c, #ff3355);
    color: #fff;
    border: none;
    padding: 3px 8px;
    font-size: 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 6px #ff003c;
}

.copy-btn:hover {
    transform: scale(1.15);
    box-shadow: 0 0 12px #ff003c;
}

.copy-btn.copied {
    background: linear-gradient(45deg, #00c853, #00ff66) !important;

    box-shadow: 0 0 18px #00ff66 !important;

@keyframes copySuccess {
    0% { transform: scale(1); }

.unique-code-box {

    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-top: 10px;
    box-shadow: inset 0 0 10px rgba(0, 217, 255, 0.3);

.unique-code-title {
    font-size: 11px;
    color: #00d9ff;

.unique-code-value {

    font-weight: bold;

    letter-spacing: 2px;

.locked-blur {

    pointer-events: none;

.unlock-btn {

.modal {

let cardsData = [];
let activeCardId = null;

function initData() {
    try {
        let saved = localStorage.getItem("store_cards_strict_v11");

        if (saved) {
            cardsData = JSON.parse(saved);
            cardsData.forEach(card => {
                let conf = CONFIG_CARDS.find(c => c.id === card.id);
                if (conf) {
                    card.uniqCode = conf.uniqCode;
                    card.avatarUrl = conf.avatarUrl;
                    card.platform = conf.platform;
                    card.email = conf.email;
                    card.username = conf.username;
                    card.password = conf.password;
                    card.backupCodes = conf.backupCodes;
                }
            });
        } else {
            cardsData = JSON.parse(JSON.stringify(CONFIG_CARDS));
        }
    } catch(e) {
        cardsData = JSON.parse(JSON.stringify(CONFIG_CARDS));
    }
    
    localStorage.setItem("store_cards_strict_v11", JSON.stringify(cardsData));
    renderCards();
}

function renderCards() {
    const grid = document.getElementById("cardsGrid");
    grid.innerHTML = "";

    cardsData.forEach((item, index) => {
        let isGoogle = item.platform === "Google";
        let isUnlocked = item.isUnlocked;

        let cardHtml = `
            <div class="card" data-card-number="${item.id}" id="card-node-${item.id}" style="animation-delay: ${index * 0.02}s;">
                <div class="card-header">
                    <div class="card-title-container">
                        <img src="${item.avatarUrl || 'https://i.postimg.cc/HkHGx81n/file-00000000724882118f328bab45762c39.png'}" alt="Avatar" class="card-avatar">
                        <span class="card-title">CARD #${item.id}</span>
                    </div>
                    <span class="login-type-badge ${isGoogle ? 'bg-google' : 'bg-facebook'}">${item.platform}</span>
                </div>

                <div class="${isUnlocked ? '' : 'locked-blur'}">
        `;

        if(isGoogle) {
            cardHtml += `
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">PRIMARY GOOGLE EMAIL</span>
                        ${isUnlocked ? `<button class="copy-btn" onmouseenter="playSound('hover')" onclick="copyText('${item.email}', this)">Copy</button>` : ''}
                    </div>
                    <span class="field-value">${isUnlocked ? item.email : '••••••••••••@gmail.com'}</span>
                </div>
            `;
        } else {
            cardHtml += `
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">FACEBOOK USERNAME/EMAIL</span>
                        ${isUnlocked ? `<button class="copy-btn" onmouseenter="playSound('hover')" onclick="copyText('${item.username}', this)">Copy</button>` : ''}
                    </div>
                    <span class="field-value">${isUnlocked ? item.username : '••••••••••••'}</span>
                </div>
            `;
        }

        cardHtml += `
            <div class="field-group">
                <div class="field-header">
                    <span class="field-label">PASSWORD</span>
                    ${isUnlocked ? `<button class="copy-btn" onmouseenter="playSound('hover')" onclick="copyText('${item.password}', this)">Copy</button>` : ''}
                </div>

        cardHtml += `

                <div class="backup-codes-grid">
        `;

                <div class="backup-code-row">

function copyText(text, btn) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
    } else {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
        } catch (err) {
            console.error('Fallback Copy Failed:', err);
        }
        document.body.removeChild(textArea);
    }

    let originalText = btn.innerText;
    btn.innerText = "COPIED ✓";
    btn.classList.add("copied");
    
    setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove("copied");
    }, 1200);
}

function openModal(id) {
    activeCardId = id;
    document.getElementById("modalTitle").innerText = `🔒 Unlock Card #${id}`;
    document.getElementById("stepUsername").value = "";
    document.getElementById("stepUniqCode").value = "";
    document.getElementById("lockerModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("lockerModal").style.display = "none";
    activeCardId = null;
}

function validateUnlock() {
    let inputUsername = document.getElementById("stepUsername").value.trim();
    let pastedCode = document.getElementById("stepUniqCode").value.trim();
    let cardIndex = cardsData.findIndex(c => c.id === activeCardId);

    if (inputUsername.toUpperCase() !== REQUIRED_USERNAME.toUpperCase()) {
        alert("Invalid User Name! Access denied.");
        return;
    }

    if (!pastedCode || pastedCode.length !== 6) {
        alert("Please enter a valid 6-Digit Uniq Code!");
        return;
    }

    if (cardIndex !== -1 && cardsData[cardIndex].uniqCode === pastedCode) {
        cardsData[cardIndex].isUnlocked = true;

        let unlockedCard = cardsData.splice(cardIndex, 1)[0];
        cardsData.unshift(unlockedCard);

        localStorage.setItem("store_cards_strict_v11", JSON.stringify(cardsData));
        
        playSound('unlock');
        renderCards();
        closeModal();

        window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
        alert("Incorrect Uniq Code for Card #" + activeCardId + "!");
    }
}

function filterCards() {
    let query = document.getElementById("searchInput").value.trim().toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach((card) => {
        let cardId = card.getAttribute("data-card-number");
        let cardItem = cardsData.find(c => c.id.toString() === cardId);

        if(!cardItem) {
            card.style.display = "none";
            return;
        }

        let emailVal = cardItem.email ? cardItem.email.toLowerCase() : "";
        let usernameVal = cardItem.username ? cardItem.username.toLowerCase() : "";
        let platformVal = cardItem.platform ? cardItem.platform.toLowerCase() : "";

        if(
            query === "" || 
            cardId === query || 
            emailVal.includes(query) || 
            usernameVal.includes(query) || 
            platformVal.includes(query)
        ) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}

window.onload = initData;
</script>

</body>
</html>
